# Build the fd-proxy-service image and push to Harbor.
#
# The image is the ONLY artifact this workflow ships. Deployment is pull-based:
# the per-worker forwarder (proxy-fw) + the control plane (proxy-control)
# reference `harbor.local/lawcraw_business/fd-proxy-service:latest` with the
# default imagePullPolicy for a `:latest` tag (Always), so pushing :latest here
# IS the deploy — the next pod restart (kubectl delete pod, or a Job relaunch)
# pulls the new image. No kubectl, no kubeconfig secret, no Argo CD needed.
#
# Mirrors scraw-fd-open-data-mcp/.github/workflows/cicd.yml (the proven Harbor
# push path for this HTTP-only registry): insecure-registries daemon.json +
# buildkitd `http=true`, default docker driver (not buildx driver — buildkit's
# own push path 401s on the blob-existence HEAD against an HTTP registry).
#
# fd-proxy-service is vendored from the local checkout in the Dockerfile
# (`pip install /build/fd-proxy-service`) — it is NOT on PyPI yet, so there is
# no FD_ODM_INSTALL build-arg unlike the scraw image. Bumping code + a push here
# lands new providers / circuit / seed logic in the image.
name: Build & Push image to Harbor

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Harbor external address (HTTP, insecure). GitHub Actions can't resolve the
  # in-cluster harbor.local alias, so use the public IP:port.
  REGISTRY: 23.144.68.246:30880
  # lawcraw_business project = where the scraw image lives too; the forwarder
  # and control-plane pods pull harbor.local/lawcraw_business/fd-proxy-service.
  IMAGE_NAME: lawcraw_business/fd-proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker daemon for insecure Harbor registry
        run: |
          echo "{\"insecure-registries\": [\"${{ env.REGISTRY }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Harbor admin account (can push to any project, incl. lawcraw_business).
          # TODO prod: replace with a scoped robot account (push/pull on
          # lawcraw_business only) stored as HARBOR_ROBOT_USER/PASSWORD, matching
          # the scraw repo's convention. admin works but is broader than needed.
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # THE fix: without http=true, buildkit pushes via HTTPS to an
          # HTTP-only registry, the blob upload starts then dies with
          # "unauthorized". Mirrors scraw-ops/docker-publish.yml exactly.
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Don't pollute :latest from a PR — build only, no push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
