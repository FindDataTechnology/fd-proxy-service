# DISABLED (2026-09-18): image builds are DOMESTIC-ONLY.
#
# Policy (user directive, 2026-09-10): GitHub-hosted runners must NEVER push to
# the domestic Harbor (23.144.68.246:30880 here) or any CN server — foreign
# runner IPs hammering domestic endpoints risk IP bans.
#
# Where this image is built instead: on the cheap fleet via Jenkins (commit
# `build: build the image on the cheap fleet via Jenkins`; see INFRA-NOTES.md).
# Deployment stays pull-based: the forwarder (proxy-fw) and the control plane
# (proxy-control) reference `lawcraw_business/fd-proxy-service:latest` with the
# default Always pull policy for `:latest`, so the next pod restart picks up the
# new image. The build steps this replaces (insecure-registries daemon.json +
# buildkitd `http=true`) are in git history if the box build needs to mirror
# them.
#
# This stub exists so the file path stays claimed and fails loudly if anyone
# re-points it at a registry.
name: Build & Push image to Harbor (disabled)

on: workflow_dispatch

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::Image builds are domestic-only (cheap-fleet Jenkins). Do not re-enable pushes from GitHub runners."
          exit 1
