# Per-worker smart forwarder — Deployment+Service form (cluster-admin shape).
#
# For clusters with a cluster-admin kubeconfig (baidu), where a Deployment +
# Service can be applied directly (the `crawl-worker` SA restrictions don't
# apply). Same :8080 addr + same `proxy-fw` entrypoint + same env as the Job
# form (proxy-fw-job.yaml); the difference is self-healing (Deployment) + a
# stable in-cluster DNS name (`proxy-fw.scraw`) so the reconciler can set
# FD_PROXY_FORWARDER=http://proxy-fw.scraw:8080 uniformly across admin
# clusters (vs. the per-cluster node IP the Job form requires).
#
# Same acquire/release contract; see proxy-fw-job.yaml for the design notes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-fw
  namespace: scraw
  labels: {app: proxy-fw}
spec:
  replicas: 1
  selector: {matchLabels: {app: proxy-fw}}
  template:
    metadata: {labels: {app: proxy-fw}}
    spec:
      containers:
      - name: proxy-fw
        image: ccr.ccs.tencentyun.com/finddata/fd-proxy-service:sha-1a1689d
        command: ["proxy-fw"]
        ports: [{containerPort: 8080}]
        env:
        - name: PROXY_REDIS_URL
          valueFrom: {secretKeyRef: {name: proxy-redis-auth, key: PROXY_REDIS_URL_FORWARDER}}
        - name: PROXY_DATABASE_URL
          valueFrom: {secretKeyRef: {name: master-db-secret, key: DATABASE_URL}}
        - name: FD_EGRESS_AUTH
          # `optional: true` 已去掉：2026-11-09 起 secret `egress-auth` 在 scraw
          # 命名空间真实存在。保留 optional 只会让"secret 被删/改名"时静默取到空值，
          # 而空值会让 gost 侧认证 407、且错误发生在运行时而不是调度期。
          valueFrom:
            secretKeyRef: {name: egress-auth, key: FD_EGRESS_AUTH}
        - {name: PROXY_FW_HOST, value: "0.0.0.0"}
        - {name: PROXY_FW_PORT, value: "8080"}
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe:  {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-fw
  namespace: scraw
spec:
  type: ClusterIP
  selector: {app: proxy-fw}
  ports:
  - name: http
    port: 80
    targetPort: 8080
