# crawl-worker ServiceAccount for reconciler dispatch (worker clusters).
#
# Applied in the scraw namespace of EVERY worker cluster (tencent, aliyun,
# zihan, america). The xinru reconciler's ClusterK8sClient authenticates with
# this token + the cluster CA (stored as <cluster>.token/<cluster>.ca keys in
# the worker-kubeconfigs Secret on the control plane) and needs:
# create ConfigMaps, create Jobs, poll Job status, and DELETE Jobs. Nothing
# else — the worker SA never touches Secrets/Services/Deployments, which is why
# the forwarder and gost run as hostNetwork Jobs with plain env
# (proxy-fw-job.yaml / gost-job.yaml).
#
# Why `delete` on jobs (added 2026-11-11, found live): cancelling a run calls
# launcher.delete(job_ref) in fd-open-data-mcp/refresh/runs.py, so without this
# verb "cancel" only flips the policy_runs row to cancelled while the pod keeps
# crawling and keeps writing to the master DB until activeDeadlineSeconds fires
# (ttlSecondsAfterFinished only removes FINISHED jobs). The 403 was swallowed
# by the reconciler and surfaced as job_deleted=false, so the panel looked fine.
# The widening is negligible: `create jobs` already allows running arbitrary
# containers in this cluster.
# Follow-up worth doing separately: this ClusterRole+ClusterRoleBinding is
# cluster-wide while the reconciler only ever acts in `clusters.namespace`
# (scraw) — a namespaced Role+RoleBinding in scraw would shrink the blast radius.
#
# Token extraction after apply:
#   k3s kubectl -n scraw get secret crawl-worker-token -o jsonpath='{.data.token}'  | base64 -d > /tmp/<cluster>.token
#   k3s kubectl -n scraw get secret crawl-worker-token -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/<cluster>.ca
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crawl-worker
  namespace: scraw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crawl-worker
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crawl-worker
subjects:
- kind: ServiceAccount
  name: crawl-worker
  namespace: scraw
roleRef:
  kind: ClusterRole
  name: crawl-worker
  apiGroup: rbac.authorization.k8s.io
---
# Non-expiring Secret-based token — the reconciler holds it long-term.
apiVersion: v1
kind: Secret
metadata:
  name: crawl-worker-token
  namespace: scraw
  annotations:
    kubernetes.io/service-account.name: crawl-worker
type: kubernetes.io/service-account-token
