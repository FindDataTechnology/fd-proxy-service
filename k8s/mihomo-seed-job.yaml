# One-shot seed for the mihomo fixed-exit pool (tasks 3.2 / 3.3).
#
# Registers the usable listeners on windows-laptop (100.64.0.10:31081-31115) as
# the `mihomo` pool provider. The old xinru-server2 pool (100.64.0.7:3008x) is
# retired — do not point this back at it. Unlike `proxy-migrate`, this Job does
# LIVE egress probes: every listener is dialled through and asked for its exit
# IP, because the carousel reassigns ports to nodes over time — a snapshot taken
# days ago is not evidence (2026-09-12's 161.114.12.26 no longer exists). The
# measured exit IP becomes the circuit unit, so every listener behind one IP
# trips as a group instead of burning one attempt per port.
#
# A listener is retried before being written off: the first (cold) connect can
# exceed the probe timeout while later ones answer in ~2s. Only a listener that
# stays unreachable is registered `retired` and kept out of the pool. A port that
# flaps can still be retired by a slow run — re-run the Job after checking it by
# hand (curl -x http://<user>:<pass>@100.64.0.10:<port> https://api.ipify.org).
#
# Credentials never enter git. Create the Secret out-of-band, then run the Job:
#   kubectl -n scraw create secret generic mihomo-creds \
#     --from-file=proxy-creds.json="$HOME/.finddata/mihomo-win-creds.json"
#   kubectl -n scraw delete job mihomo-seed --ignore-not-found
#   kubectl -n scraw apply -f k8s/mihomo-seed-job.yaml
#   kubectl -n scraw logs job/mihomo-seed
#
# Idempotent: re-running with an unchanged pool reports zeros and writes nothing.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mihomo-seed
  namespace: scraw
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: fd-harbor-pull
      containers:
      - name: mihomo-seed
        image: 100.64.0.8:30880/finddata/fd-proxy-service:sha-1a1689d
        command: ["fd-proxy-service", "seed-mihomo"]
        env:
        # Canonical DB (guangzhou-xinru fd-postgres :30432 over mesh) — same
        # secret the control plane reads.
        - name: PROXY_DATABASE_URL
          valueFrom: {secretKeyRef: {name: fd-db-secret, key: DATABASE_URL}}
        - {name: MIHOMO_CREDS_FILE, value: /etc/mihomo/proxy-creds.json}
        volumeMounts:
        - {name: creds, mountPath: /etc/mihomo, readOnly: true}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits:   {cpu: 500m, memory: 256Mi}
      volumes:
      - name: creds
        secret: {secretName: mihomo-creds}
