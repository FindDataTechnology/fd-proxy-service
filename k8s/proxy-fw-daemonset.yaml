# proxy-fw — per-node egress forwarder, DaemonSet form (live source of truth).
#
# Supersedes the historical Deployment/Job forms in this directory (those pin the
# retired Harbor registry <registry>:30880 and are no longer applied). This is the
# shape actually running in namespace `scraw`: hostNetwork, binds :8080 on every
# node so in-cluster crawlers reach the forwarder at <node-ip>:8080.
#
# Liveness note (2026-11-07): timeoutSeconds was raised 1 -> 5 and
# failureThreshold 3 -> 5 after the 1s/3x probe killed healthy pods under CPU
# throttling (89-122 clean-exit restarts per node over 27 days, exit code 0).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations: {}
  labels:
    app: proxy-fw
  name: proxy-fw
  namespace: scraw
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: proxy-fw
  template:
    metadata:
      labels:
        app: proxy-fw
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - liuliangth1zdmvyyvr0
                - liuliangdmh1xr0w9ryu
      containers:
      - command:
        - proxy-fw
        env:
        # Credentials come from the Secret, never a literal: the 2026-11-08
        # rotation invalidated the password baked into this file, which would
        # have broken every forwarder on the next apply. PROXY_REDIS_URL_CONTROL
        # is db/1 (circuit state) — the crawler-facing REDIS_URL in the same
        # secret is db/0, and pointing the forwarder at it would move the
        # circuits into the wrong keyspace.
        - name: PROXY_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: fd-db-secret
              key: PROXY_REDIS_URL_CONTROL
        - name: PROXY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fd-db-secret
              key: DATABASE_URL
        # gost 出口代理的 basic-auth：**不再是明文**。2026-11-09 轮换并改走 secret
        # （`egress-auth/FD_EGRESS_AUTH`，scraw 命名空间，两个集群各一份）。
        # 在此之前这枚值直接写在这里，且与 gost 的 `-L` 逐字符相同——即"现役有效
        # 凭据躺在仓库里"。注意 gost 侧同样已改成 `sh -c 'exec gost -L http://$FD_EGRESS_AUTH@:30080'`
        # 从同一个 secret 取值，两侧必须一起改，否则 407。
        - name: FD_EGRESS_AUTH
          valueFrom:
            secretKeyRef:
              name: egress-auth
              key: FD_EGRESS_AUTH
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: PROXY_FW_HOST
          value: 0.0.0.0
        - name: PROXY_FW_PORT
          value: '8080'
        image: ccr.ccs.tencentyun.com/lawcraw-business/fd-proxy-service:sha-ad65424
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: proxy-fw
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      hostNetwork: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - operator: Exists
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
