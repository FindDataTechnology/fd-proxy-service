# Per-worker smart forwarder — hostNetwork Job form (the SA-compatible shape).
#
# Runs on each worker cluster (each worker cluster) BESIDE the
# already-deployed gost hostNetwork Job. The `crawl-worker` ServiceAccount the
# reconciler dispatches through can create ConfigMaps + jobs.batch but NOT
# Deployments /
# Services / DaemonSets (verified via `kubectl auth can-i`), so this is a
# hostNetwork Job — the same form gost-job.yaml uses. A Deployment+Service form
# (proxy-fw-deployment.yaml) is used on clusters with a cluster-admin
# kubeconfig (baidu).
#
# REACHABILITY: with hostNetwork + no Service, the forwarder is reachable at the
# node IP:8080 (stable on a single-node cluster). The reconciler injects
# FD_PROXY_FORWARDER=http://<worker-node-ip>:8080 per cluster — it cannot be a
# stable `proxy-fw.scraw` DNS name on SA-restricted clusters (that would need a
# Service, which the SA cannot create). On admin clusters the Deployment form
# provides the DNS name.
#
# The forwarder serves the acquire/release contract on :8080. scraw calls
# /acquire + /release per fetch — it does NOT set HTTP_PROXY and blind-tunnel
# CONNECT, because the crawler must terminate TLS itself to classify ban
# responses (see forwarder/server.py + design.md forwarder-shape decision).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: proxy-fw
  namespace: scraw
  labels: {app: proxy-fw}
spec:
  backoffLimit: 20
  template:
    metadata: {labels: {app: proxy-fw}}
    spec:
      # hostNetwork: bind :8080 directly to the node IP so in-cluster crawl
      # pods reach the forwarder without a Service (which the SA can't create).
      # dnsPolicy omitted (default ClusterFirst) — same as gost-job.yaml.
      hostNetwork: true
      restartPolicy: OnFailure
      containers:
      - name: proxy-fw
        image: ccr.ccs.tencentyun.com/finddata/fd-proxy-service:sha-1a1689d
        # One image, two entrypoints — the forwarder selects `proxy-fw`.
        command: ["proxy-fw"]
        ports: [{containerPort: 8080}]
        env:
        # Circuit-state Redis: the canonical fd-redis on guangzhou-the db host
        # (mesh <db-host>:30380, db 1 — shared with proxy-control on the the db host
        # control plane; replaces the dedicated proxy-redis previously run on a worker host,
        # retired). PLAIN VALUE (not secretKeyRef): worker clusters run the
        # crawl-worker SA, which can create jobs.batch + configmaps but NOT
        # secrets — same credential-injection pattern as the reconciler's crawl
        # jobs. __REDIS_PW__ is substituted on guangzhou-the db host from
        # /etc/fd-open-data/db-credentials.env before applying (never printed).
        - name: PROXY_REDIS_URL
          value: "redis://:__REDIS_PW__@<db-host>:30380/1"
        # Canonical DB (guangzhou-the db host fd-postgres, mesh <db-host>:30432, db
        # fd_open_data) — the forwarder reads the proxies/provider rows to
        # resolve upstream addresses. __PG_PW__ substituted on the db host from the
        # same credentials file before applying (plain value because the
        # crawl-worker SA cannot create Secrets on worker clusters).
        - name: PROXY_DATABASE_URL
          value: "postgresql+psycopg2://fd:__PG_PW__@<db-host>:30432/fd_open_data"
        # gost basic-auth — baked onto the proxies row at seed time (not read on
        # the hot path); this only feeds the /providers health endpoint so it can
        # report whether the default insecure cred is still in effect. ROTATE
        # before prod (gost NodePort 30080 is public).
        - name: FD_EGRESS_AUTH
          value: "fdproxy:CHANGE_ME"
        # The forwarder's own node IP (downward API). The gost-own provider
        # rewrites its seeded 127.0.0.1:30080 upstream to this IP at /acquire
        # time: the upstream_url is dialed by the CRAWL pod on this node, whose
        # loopback is its own netns — the node's hostNetwork gost :30080 is
        # only reachable there via the node IP. Unset (local dev / the central
        # proxy-control, which hosts no gost) keeps 127.0.0.1, which is correct
        # when caller and forwarder share a netns.
        - name: K8S_NODE_IP
          valueFrom: {fieldRef: {fieldPath: status.hostIP}}
        - {name: PROXY_FW_HOST, value: "0.0.0.0"}
        - {name: PROXY_FW_PORT, value: "8080"}
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe:  {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits:   {cpu: 500m, memory: 512Mi}
