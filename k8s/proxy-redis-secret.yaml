# Credentials for the dedicated proxy-redis.
#
# proxy-redis holds circuit state (ban counters) + the outcomes stream — low-
# sensitivity data, but its NodePort 30381 is PUBLIC (worker forwarders write
# to it cross-cluster), so it MUST NOT be an open relay. An unauthenticated
# public Redis would let anyone FLUSHALL circuit state (reset every ban = re-
# trigger bans we already knew about) or inject fake OPEN states (DoS the crawl
# by blocking every healthy upstream).
#
# The password is URL-safe (alnum only) so it splices into the redis:// URL
# without percent-encoding. ROTATE this default before prod — it is checked in
# only so a fresh `kubectl apply` is immediately functional (same posture as
# the gost FD_EGRESS_AUTH default).
#
# Create on the MASTER cluster BEFORE applying proxy-redis.yaml (the redis
# server reads REDIS_PASSWORD from it):
#   kubectl -n scraw apply -f k8s/proxy-redis-secret.yaml
# AND on EVERY WORKER cluster that runs a forwarder, BEFORE applying
# proxy-fw-job.yaml — the forwarder pod reads PROXY_REDIS_URL_FORWARDER from
# it (the cross-cluster URL embeds the password). The same manifest applies
# verbatim on workers (it carries no cluster-specific value); a worker needs
# only the two URL keys, but shipping all three is harmless.
---
apiVersion: v1
kind: Secret
metadata:
  name: proxy-redis-auth
  namespace: scraw
type: Opaque
stringData:
  # The redis-server --requirepass value (used by proxy-redis.yaml).
  REDIS_PASSWORD: "CHANGE_ME"
  # In-cluster URL — the control plane (proxy-control) uses this.
  PROXY_REDIS_URL_CONTROL: "redis://:CHANGE_ME@proxy-redis:6379/0"
  # Cross-cluster URL — the worker forwarder (proxy-fw) uses this (master
  # NodePort 30381, which is reachable from worker clusters — unlike worker
  # NodePorts, master NodePorts work cross-cluster).
  PROXY_REDIS_URL_FORWARDER: "redis://:CHANGE_ME@<proxy-redis-host>:30381/0"
