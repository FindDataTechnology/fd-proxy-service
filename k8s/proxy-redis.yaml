# Dedicated proxy-redis for fd-proxy-service.
#
# Owns circuit state (`circuit:{source}:{addr_id}`) + the outcomes stream
# (`outcomes:{source}`). Deliberately SEPARATE from fd-open-redis (6379, the
# crawler's dedupe queue) and master Redis (NodePort 30380) so a key collision
# or a flush of one never touches the others.
#
# NodePort 30381 is the cross-cluster address worker forwarders write outcomes
# to (the hot-path read is in-cluster `proxy-redis:6379`; the write-back from a
# worker hits `<proxy-redis-host>:30381`).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-redis
  namespace: scraw
  labels: {app: proxy-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: proxy-redis}}
  template:
    metadata: {labels: {app: proxy-redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        # appendonly: persist circuit state across restarts (a wipe resets every
        # circuit to CLOSED = "all healthy", which re-triggers bans we already
        # knew about). AOF is cheap for the small circuit working set.
        # requirepass: NodePort 30381 is PUBLIC (cross-cluster writes from
        # worker forwarders) — an unauthenticated Redis would be an open relay.
        # The shell expands $REDIS_PASSWORD (from proxy-redis-auth) at startup.
        command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
        env:
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: proxy-redis-auth, key: REDIS_PASSWORD}}}
        ports: [{containerPort: 6379}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits:   {cpu: 250m, memory: 256Mi}
        readinessProbe: {tcpSocket: {port: 6379}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe:  {tcpSocket: {port: 6379}, initialDelaySeconds: 15, periodSeconds: 20}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: proxy-redis}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proxy-redis
  namespace: scraw
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-redis
  namespace: scraw
spec:
  type: NodePort
  selector: {app: proxy-redis}
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    nodePort: 30381
