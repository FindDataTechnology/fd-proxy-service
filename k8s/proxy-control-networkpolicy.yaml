# proxy-control 管理面的入站收敛（审计 03 §7 的 NetworkPolicy 那一半）
#
# 背景（2026-11-09 实测）：
#   * `/providers`、`/circuits`、`/management/rate-limits` 在**集群内匿名可读**
#     （无需任何凭据即 200，返回代理池 ip/port/status）；
#   * 宿主回环 `127.0.0.1:30090` 同样匿名 200；
#   * 但**公网不可达**：从集群外打节点公网 IP 的 30090，TCP 层就连不上；
#     同 IP 的 22/80/443 可达（正控），所以这个"不可达"是有意义的。
#   → 因此本策略是**纵深防御**（把"内网可见"再收一层），不是止血。
#
# 谁合法要调它（实测：全集群只有这些）：
#   * 同命名空间内的 proxy-control 自身与 proxy-fw；
#   * `fd-mcp` 命名空间的 `fd-panel`（面板读代理池状态）。
#   另外实测**没有任何负载配置 `FD_PROXY_FORWARDER`**（出口池当前无人使用），
#   所以收紧入站不会打断爬取。
#
# 生效前提已验证：**这个集群的 CNI 执行 NetworkPolicy** —— 先建一条
# `ingress: []` 的空策略，集群内 curl → `000`；删掉 → `200`。正控成立。
#
# 注意：不收敛出站（egress）。proxy-control 要连 Redis / Postgres / 各代理节点，
# 出站白名单需要真实 CIDR，填错会让整个代理控制面失联——那是另一次变更。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-control-ingress
  namespace: scraw
  labels:
    app.kubernetes.io/part-of: fd-proxy-service
spec:
  podSelector:
    matchLabels:
      app: proxy-control
  policyTypes:
    - Ingress
  ingress:
    # 同命名空间（proxy-fw 健康检查、proxy-control 自身）
    - from:
        - podSelector: {}
    # 面板：fd-mcp/fd-panel 读代理池与熔断状态
    # ⚠️ `port` 必须是**容器端口**（8000），不是 Service 端口（80）。
    # 2026-11-09 实测踩过：写成 80 之后连允许方也被拒（200 → 000），
    # 因为 NetworkPolicy 匹配的是 pod 的 listener，不经 Service 做端口转换。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fd-mcp
      ports:
        - protocol: TCP
          port: 8000
