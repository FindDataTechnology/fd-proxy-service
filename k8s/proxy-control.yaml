# Control plane for fd-proxy-service (the `proxy-control` server).
#
# Runs on the CONTROL cluster (guangzhou-xinru k3s, ns scraw); admin kubeconfig
# can run Deployments (worker `crawl-worker` SA can create Jobs, not
# Deployments). Owns the provider
# registry (reads the `proxies` table from the canonical xinru DB) + serves the
# acquire/release/health/providers/circuits HTTP API on NodePort 30090
# (30000-32767 NodePorts MUST avoid the host-docker ports 30432/30380).
#
# The forwarder on each worker reuses the SAME app code (forwarder/server.py);
# both point PROXY_REDIS_URL at the canonical fd-redis on guangzhou-xinru
# (mesh 100.64.0.3:30380 db1) — control via fd-db-secret, forwarder via plain
# env (worker SA cannot create Secrets).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-control
  namespace: scraw
  labels: {app: proxy-control}
spec:
  replicas: 1
  selector: {matchLabels: {app: proxy-control}}
  template:
    metadata: {labels: {app: proxy-control}}
    spec:
      imagePullSecrets:
      - name: fd-harbor-pull
      containers:
      - name: proxy-control
        image: ccr.ccs.tencentyun.com/lawcraw-business/fd-proxy-service:sha-ad65424
        # One image, two entrypoints — the control plane selects `proxy-control`.
        command: ["proxy-control"]
        ports: [{containerPort: 8000}]
        env:
        # Circuit-state Redis: canonical fd-redis on guangzhou-xinru, db 1
        # (mesh 100.64.0.3:30380; password-protected host-docker instance).
        - name: PROXY_REDIS_URL
          valueFrom: {secretKeyRef: {name: fd-db-secret, key: PROXY_REDIS_URL_CONTROL}}
        # Canonical DB URL (guangzhou-xinru fd-postgres :30432 over mesh).
        - name: PROXY_DATABASE_URL
          valueFrom: {secretKeyRef: {name: fd-db-secret, key: DATABASE_URL}}
        - {name: PROXY_CONTROL_HOST, value: "0.0.0.0"}
        - {name: PROXY_CONTROL_PORT, value: "8000"}
        # 控制面共享令牌（fail-closed）：未配置时 /management/* 一律 503、/acquire
        # 与 /release 401。Secret 由集群侧一次性创建（键只增不删），本清单不承载值。
        # 调用方读同名值的 PROXY_CONTROL_TOKEN（fd-open-data-mcp/.../proxy/injection.py、
        # fd-data-quality/scripts/_nbs_client.py）。
        - name: MANAGEMENT_TOKEN
          valueFrom: {secretKeyRef: {name: proxy-control-token, key: MANAGEMENT_TOKEN}}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe:  {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 20}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits:   {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-control
  namespace: scraw
spec:
  type: NodePort
  selector: {app: proxy-control}
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30090
