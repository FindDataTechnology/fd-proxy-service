# Stable shell for running the proxy-service migration + seed by hand.
# The Job (proxy-migrate-job.yaml) deletes its pod on BackoffLimitExceeded,
# taking the logs with it. This pod sleeps so we can `kubectl exec` the three
# migration steps one at a time and see exactly which one fails.
#
#   kubectl -n scraw apply -f k8s/proxy-migrate-shell.yaml
#   kubectl -n scraw wait --for=condition=ready pod/proxy-migrate-shell --timeout=120s
#   kubectl -n scraw exec proxy-migrate-shell -- python /app/migrate.py
#   kubectl -n scraw delete -f k8s/proxy-migrate-shell.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: proxy-migrate-shell
  namespace: scraw
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: harbor.local/lawcraw_business/fd-proxy-service:latest
    command: ["sleep", "1200"]
    env:
    - name: PROXY_DATABASE_URL
      valueFrom: {secretKeyRef: {name: master-db-secret, key: DATABASE_URL}}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits:   {cpu: 500m, memory: 512Mi}
